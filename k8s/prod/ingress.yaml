apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moneyball
  namespace: moneyball
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: moneyball.leoferolive.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moneyball
                port:
                  number: 80
